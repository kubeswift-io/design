name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tokens.css is up to date and every colour is a token
        run: npm run check
      - name: kit regenerates without errors
        run: npm run kit
